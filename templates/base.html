<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Tienda de barrio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header>
    <nav>
      <strong>Tienda de barrio</strong>
      <a href="/venta" {% if request.path == '/venta' %}class="activo"{% endif %}>Registrar venta</a>
      <a href="/productos" {% if request.path == '/productos' %}class="activo"{% endif %}>Productos</a>
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
